<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="45%" stop-color="#93006C"/>
      <stop offset="100%" stop-color="#4A0037"/>
    </linearGradient>
    <linearGradient id="sphereGrad" x1="25%" y1="20%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F5D0FE"/>
      <stop offset="60%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#6B004F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#93006C" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2D0022" flood-opacity="0.5"/>
    </filter>
    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#300024" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glow Effect -->
  <circle cx="256" cy="220" r="210" fill="url(#glow)"/>

  <!-- Clover Accents (Luck Motif) -->
  <g opacity="0.18" fill="#FFFFFF">
    <circle cx="100" cy="110" r="28"/>
    <circle cx="140" cy="110" r="28"/>
    <circle cx="120" cy="90" r="28"/>
    <circle cx="120" cy="130" r="28"/>
    <path d="M120 120 Q120 160 100 170" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <g opacity="0.18" fill="#FFFFFF">
    <circle cx="390" cy="400" r="24"/>
    <circle cx="425" cy="400" r="24"/>
    <circle cx="408" cy="382" r="24"/>
    <circle cx="408" cy="418" r="24"/>
    <path d="M408 410 Q408 440 395 450" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Golden Stars of Strategy -->
  <path d="M256 48 L263 68 L285 70 L268 84 L273 105 L256 93 L239 105 L244 84 L227 70 L249 68 Z" fill="url(#goldGrad)" filter="url(#dropShadow)"/>
  <path d="M410 130 L415 144 L430 145 L418 155 L422 170 L410 161 L398 170 L402 155 L390 145 L405 144 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M98 370 L103 384 L118 385 L106 395 L110 410 L98 401 L86 410 L90 395 L78 385 L93 384 Z" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Main Lottery Ball 3D -->
  <circle cx="256" cy="245" r="145" fill="url(#sphereGrad)" filter="url(#ballShadow)"/>

  <!-- Ball Inner Ring -->
  <circle cx="256" cy="245" r="102" fill="#FFFFFF" fill-opacity="0.96"/>
  <circle cx="256" cy="245" r="92" fill="none" stroke="#93006C" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- Ball Core Number "15" -->
  <text x="256" y="278" font-family="'Montserrat', -apple-system, sans-serif" font-size="94" font-weight="900" fill="#93006C" text-anchor="middle" letter-spacing="-3">15</text>

  <!-- Specular Light Reflection -->
  <ellipse cx="205" cy="165" rx="55" ry="32" transform="rotate(-32 205 165)" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- Bottom Brand Ribbon Badge: "PRO" -->
  <g filter="url(#dropShadow)">
    <rect x="156" y="388" width="200" height="56" rx="28" fill="url(#goldGrad)"/>
    <rect x="160" y="392" width="192" height="48" rx="24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8"/>
    <text x="256" y="425" font-family="'Montserrat', -apple-system, sans-serif" font-size="28" font-weight="900" fill="#451A03" text-anchor="middle" letter-spacing="4">LOTOFÁCIL PRO</text>
  </g>
</svg>
