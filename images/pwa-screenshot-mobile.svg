      <circle cx="256" cy="184" r="22" fill="#93006C"/><text x="256" y="190" fill="#FFF" text-anchor="middle">19</text>
      <circle cx="332" cy="184" r="22" fill="#93006C"/><text x="332" y="190" fill="#FFF" text-anchor="middle">20</text>
      
