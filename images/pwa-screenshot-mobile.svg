    <text x="20" y="25" font-family="'Montserrat'" font-size="13" font-weight="800" fill="#FFF">GRUPO 1 - JOGOS ESTRATÉGICOS</text>
    <text x="20" y="65" font-family="'Montserrat'" font-size="12" font-weight="800" fill="#93006C">JOGO 1 - 15 NÚMEROS</text>

