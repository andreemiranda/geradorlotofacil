      <circle cx="152" cy="16" r="14" fill="#93006C"/><text x="152" y="21" font-family="'Montserrat'" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">06</text>
      <circle cx="186" cy="16" r="14" fill="#93006C"/><text x="186" y="21" font-family="'Montserrat'" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">08</text>
